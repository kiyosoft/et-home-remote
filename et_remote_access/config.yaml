name: Et Remote Access
version: "0.1.3"
slug: et_remote_access
description: Share this Home Assistant through a self-hosted zrok2 overlay (Nabu Casa-style URL).
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
homeassistant_api: true
host_network: true
options:
  zrok_api: https://zrok2.home.feedbyte.io
  enable_token: ""
  share_name: ""
  target: http://127.0.0.1:8123
schema:
  zrok_api: url
  enable_token: password
  share_name: str
  target: str
